<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autodesk-innlogging</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:32px;background:#f3f5f8;color:#101828}
    .card{max-width:620px;margin:40px auto;background:#fff;border:1px solid #d9e0ea;border-radius:14px;padding:24px;box-shadow:0 2px 10px rgba(16,24,40,.08)}
    h1{font-size:20px;color:#0057B8;margin:0 0 10px}p{line-height:1.5;color:#475467}
  </style>
</head>
<body>
  <div class="card"><h1>Autodesk Forma</h1><p id="msg">Fullfører innlogging …</p></div>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const payload = {
        type: 'NORCONSULT_APS_OAUTH_CALLBACK',
        code: params.get('code'),
        state: params.get('state'),
        error: params.get('error'),
        error_description: params.get('error_description')
      };
      const msg = document.getElementById('msg');
      if (window.opener) {
        window.opener.postMessage(payload, location.origin);
        msg.textContent = payload.error ? 'Innlogging feilet. Du kan lukke dette vinduet.' : 'Innlogging fullført. Dette vinduet kan lukkes.';
        setTimeout(() => window.close(), 500);
      } else {
        msg.textContent = 'Kunne ikke finne vinduet som startet innloggingen. Lukk vinduet og prøv på nytt.';
      }
    })();
  </script>
</body>
</html>
